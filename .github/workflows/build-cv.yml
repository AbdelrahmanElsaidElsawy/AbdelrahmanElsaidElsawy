name: Build CV

# Sole CV source (LaTeX + built PDFs). The website repo syncs PDFs from here.
# Designed: cv.tex / cv_de.tex / cv_tr.tex / cv_fr.tex / cv_ar.tex
# ATS:      cv_ats.tex / cv_ats_de.tex / cv_ats_tr.tex / cv_ats_fr.tex / cv_ats_ar.tex
# Arabic uses XeLaTeX (Amiri + polyglossia); others use pdfLaTeX.

on:
  push:
    branches: [main]
    paths:
      - 'cv/**/*.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile CV (EN designed)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv/cv.tex

      - name: Compile CV (EN ATS)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv/cv_ats.tex

      - name: Compile CV (DE designed)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv/cv_de.tex

      - name: Compile CV (DE ATS)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv/cv_ats_de.tex

      - name: Compile CV (TR designed)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv/cv_tr.tex

      - name: Compile CV (TR ATS)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv/cv_ats_tr.tex

      - name: Compile CV (FR designed)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv/cv_fr.tex

      - name: Compile CV (FR ATS)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv/cv_ats_fr.tex

      - name: Compile CV (AR designed)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv/cv_ar.tex
          latexmk_use_xelatex: true

      - name: Compile CV (AR ATS)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv/cv_ats_ar.tex
          latexmk_use_xelatex: true

      - name: Publish PDFs
        run: |
          set -e
          publish() {
            local found
            found="$(find . -name "$1" -print -quit || true)"
            if [ -n "$found" ]; then
              mv "$found" "cv/$2"
              echo "Published cv/$2"
            else
              echo "Missing $1 — skipped"
            fi
          }
          publish cv.pdf        Abdelrahman_Elsaid_Elsawy_CV.pdf
          publish cv_ats.pdf    Abdelrahman_Elsaid_Elsawy_CV_ATS.pdf
          publish cv_de.pdf     Abdelrahman_Elsaid_Elsawy_CV_DE.pdf
          publish cv_ats_de.pdf Abdelrahman_Elsaid_Elsawy_CV_DE_ATS.pdf
          publish cv_tr.pdf     Abdelrahman_Elsaid_Elsawy_CV_TR.pdf
          publish cv_ats_tr.pdf Abdelrahman_Elsaid_Elsawy_CV_TR_ATS.pdf
          publish cv_fr.pdf     Abdelrahman_Elsaid_Elsawy_CV_FR.pdf
          publish cv_ats_fr.pdf Abdelrahman_Elsaid_Elsawy_CV_FR_ATS.pdf
          publish cv_ar.pdf     Abdelrahman_Elsaid_Elsawy_CV_AR.pdf
          publish cv_ats_ar.pdf Abdelrahman_Elsaid_Elsawy_CV_AR_ATS.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv/*.pdf
          if git diff --staged --quiet; then
            echo "PDFs unchanged"
          else
            git commit -m "Build CV PDFs [skip ci]"
            git push
          fi
